<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Social Media App</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #FAE6FA;
        }
        h1 {
            margin-top: 50px;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 25%;
            border: 2px solid black;
        }
        th, td {
            border: 2px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #FFFFFF;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        button {
            padding: 8px 16px;
            margin-right: 10px;
            background-color: #3377FF;
            color: #FFF;
            border: none;
        }

        form {
            margin-top: 20px;
        }
    </style>
</head>
<body>
  <h1 style="font-size: 48px;">Welcome to Social Media App</h1>
  <h4>Login to proceed :)</h4>

  <h1>Login</h1>
  <form method="post" action="">
      {% csrf_token %}
      <table>
          <tr>
              <td colspan="2"><b><center>Enter your credentials</center></b></td>
          </tr>
          <tr>
              <th><label for="username">Username:</label></th>
              <td><input type="text" id="username" name="username" required></td>
          </tr>
          <tr>
              <th><label for="password">Password:</label></th>
              <td><input type="password" id="password" name="password" required></td>
          </tr>
      </table>
      <br>
      {% if messages %}
          {% for message in messages %}
              <div class="error">{{ message }}</div>
          {% endfor %}
      {% endif %}
      <br>
      <button type="submit">Login</button>
  </form>
  <!-- Register button -->
  <form action="{% url 'register' %}">
      <button type="submit" class="register-button">New Registeration</button>
  </form>
</body>
</html>
