<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #FAE6FA;
        }
        h1 {
            margin-top: 50px;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 25%;
            border: 2px solid black;
        }
        th, td {
            border: 2px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #FFFFFF;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        button {
            padding: 8px 16px;
            margin-right: 10px;
            background-color: #3377FF;
            color: #FFF;
            border: none;
        }

        form {
            margin-top: 20px;
        }
    </style>
</head>
<body>
 <h1 style="font-size: 48px;">Welcome to Social Media App</h1>
  <h4>Create New Account</h4>
  <h1>Register</h1>
<form method="post">
        {% csrf_token %}
        <table>
            <tr>
                <th><label for="id_username">Username:</label></th>
                <td>{{ form.username }}</td>
            </tr>
            <tr>
                <th><label for="id_email">Email ID:</label></th>
                <td>{{ form.email }}</td>
            </tr>
            <tr>
                <th><label for="id_password1">Password:</label></th>
                <td>{{ form.password1 }}</td>
            </tr>
            <tr>
                <th><label for="id_password2">Confirm Password:</label></th>
                <td>{{ form.password2 }}</td>
            </tr>
        </table>

        {% if form.errors %}
            <div class="error">
                Please correct the errors in the form.
            </div>
        {% endif %}

        <br>
        <button type="submit">Register</button>
    </form>
</div>
</body>
</html>
