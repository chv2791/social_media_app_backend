<!DOCTYPE html>
<html>
<head>
    <title>{{ profile.username }}'s Profile</title>
    <style>
        body {
            font-family: Arial;
            background-color: #FAE6FA;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            font-size: 36px;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 40%;
            border: 2px solid black;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
            text-align: left;
            background-color: white;
        }

        img {
            margin-top: 15px;
            border-radius: 10px;
        }

        .btn-back {
            padding: 10px 16px;
            background-color: #dc3545;
            color: white;
            border: none;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            border-radius: 5px;
        }

        .btn-back:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <h1>{{ profile.username }}'s Profile</h1>

    <table>
        <tr>
            <th>Username:</th>
            <td>{{ profile.username }}</td>
        </tr>
        {% if profile.profile_picture %}
        <tr>
            <th>Profile Picture:</th>
            <td>
                <img src="{{ profile.profile_picture.url }}" alt="Profile Picture" width="150">
            </td>
        </tr>
        <tr>
            <th>Email:</th>
            <td>{{ profile.email }}</td>
        </tr>
        <tr>
            <th>Birth Date:</th>
            <td>{{ profile.birth_date }}</td>
        </tr>
        {% endif %}
    </table>

    <a href="{% url 'search_users' %}" class="btn-back">Back to Search</a>

</body>
</html>
